app-id: io.github.enteraname74.soulsearching
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: SoulSearching

finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --filesystem=home
  - --device=dri
  - --socket=x11
  - --own-name=org.mpris.MediaPlayer2.SoulSearching

modules:
  - name: vlc
    buildsystem: autotools
    rm-configure: true
    config-opts:
      - BUILDCC=/usr/bin/gcc -std=gnu99
      - --disable-a52
      - --disable-lua
      - --disable-qt
      - --disable-skins2
      - --disable-nls
    post-install:
      - rm -f /app/lib/vlc/plugins/plugins.dat
      - /app/lib/vlc/vlc-cache-gen /app/lib/vlc/plugins
    sources:
      - type: archive
        url: https://download.videolan.org/videolan/vlc/3.0.23/vlc-3.0.23.tar.xz
        sha256: e891cae6aa3ccda69bf94173d5105cbc55c7a7d9b1d21b9b21666e69eff3e7e0

  - name: SoulSearching
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.enteraname74.soulsearching.desktop
        /app/share/applications/io.github.enteraname74.soulsearching.desktop
      - install -Dm644 app_icon_bg.png
        /app/share/icons/hicolor/128x128/apps/io.github.enteraname74.soulsearching.png
      - cp -ru . /app
    sources:
      - type: archive
        path: build/distributions/soulsearching-0.16.0-linux.tar.gz
      - type: file
        path: src/commonMain/composeResources/drawable/app_icon_bg.png
      - type: file
        path: io.github.enteraname74.soulsearching.desktop
