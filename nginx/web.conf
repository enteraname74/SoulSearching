server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always check whether the application entry point changed.
    location = /index.html {
        expires -1;
    }

    # Wasm must use the correct MIME type and be revalidated.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
        expires -1;
    }

    # Revalidate generated application code and styles.
    location ~* \.(js|mjs|css)$ {
        try_files $uri =404;
        expires -1;
    }

    # These can generally be cached longer.
    location ~* \.(png|jpg|jpeg|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }
}